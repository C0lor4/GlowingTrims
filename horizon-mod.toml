id = "glowing_trims"
name = "Glowing Trims"
version = "1.2.1"
description = "Render armor trim patterns as persistent material-colored emitters with a traveling highlight."
authors = ["C0lor4"]
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Keep the nightly's crate-visible TryIntoApi and block_state::install re-exports
# in the same generated patch crate as their users.
[[native.module]]
id = "trim_light"
file = "crates/horizon-client/src/game/modding/api_values/block_state.rs"
name = "glowing_trims_light"
source = "src/trim_light.rs"

# Only the third push emits the dynamic trim. The first two emit base armor
# and the resource pack's optional emissive armor layer.
[[native.mixin]]
id = "worn_trim_shine"
target = "horizon_client::game::armor_stands::Game<'_>::armor_layers"
kind = "MODIFY_ARG"
selector = "out.push"
require = 3
ordinal = 2
argument = 0
helper = "src/mixins/worn_trim.rs"
bindings = [{ name = "trim", ty = "(&Part, [f32; 4], u32, u32, bool)", value = "$value" }]

# The fifth put() draws the trim after the stand, armor and their emissive layers.
[[native.mixin]]
id = "armor_stand_trim_light"
target = "horizon_client::game::armor_stands::Game<'_>::armor_stand_vertices"
kind = "MODIFY_ARG"
selector = "put"
require = 5
ordinal = 4
argument = 7
helper = "src/mixins/stand_trim.rs"
bindings = [{ name = "_light", ty = "u32", value = "$value" }]

# Set the trim's emission tier on the stand's final draw.
[[native.mixin]]
id = "armor_stand_trim_shine"
target = "horizon_client::game::armor_stands::Game<'_>::armor_stand_vertices"
kind = "MODIFY_ARG"
selector = "put"
require = 5
ordinal = 4
argument = 8
helper = "src/mixins/stand_shine.rs"
bindings = [{ name = "_overlay", ty = "u32", value = "$value" }]

[[native.module]]
id = "trim_texture"
file = "crates/horizon-client/src/game/modding/api_values/block_state.rs"
name = "glowing_trims_texture"
source = "src/shine_texture.rs"

[[native.mixin]]
id = "start_trim_uploads"
target = "horizon_client::game::armor_stands::Game<'_>::prepare_trims"
kind = "HEAD"
helper = "src/mixins/atlas_start.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "visible_trims"
target = "horizon_client::game::armor_stands::Game<'_>::prepare_trims"
kind = "MODIFY_ARG"
selector = "self.trim_slots.prepare"
require = 1
ordinal = 0
argument = 0
helper = "src/mixins/atlas_wanted.rs"
bindings = [{ name = "wanted", ty = "Vec<TrimTexture>", value = "$value" }]

[[native.mixin]]
id = "finish_trim_uploads"
target = "horizon_client::game::armor_stands::Game<'_>::prepare_trims"
kind = "RETURN"
helper = "src/mixins/atlas_finish.rs"
bindings = [
    { name = "_unit", ty = "()", value = "$value" },
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

# Apply the same unshaded normals as Horizon's emissive eyes to the trim
# once player, remote mob and stand geometry are present in the world frame.
[[native.mixin]]
id = "flat_emissive_trim_faces"
target = "horizon_client::game::Game<'_>::entity_geometry"
kind = "RETURN"
helper = "src/mixins/world_emission.rs"
bindings = [
    { name = "geometry", ty = "(Vec<Vertex>, Arc<[StaticSectionSnapshot]>, Vec<[i32; 3]>, StaticCacheFrameStats,)", value = "$value" },
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]
